name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: copilot, POSTGRES_PASSWORD: ci_only_password, POSTGRES_DB: copilot_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U copilot" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Tests on SQLite
        run: pytest -q
      - name: Tests on PostgreSQL + pgvector
        env:
          TEST_DATABASE_URL: postgresql+psycopg://copilot:ci_only_password@localhost:5432/copilot_test
          DATABASE_URL: postgresql+psycopg://copilot:ci_only_password@localhost:5432/copilot_test
        run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL + pgvector (incl. 256 -> 768 resize) and round-trip
        env:
          DATABASE_URL: postgresql+psycopg://copilot:ci_only_password@localhost:5432/copilot_migrate
        run: |
          PGPASSWORD=ci_only_password psql -h localhost -U copilot -d copilot_test -c "CREATE DATABASE copilot_migrate"
          alembic upgrade head
          alembic downgrade 0002 && EMBEDDING_DIM=768 alembic upgrade head
          alembic downgrade base && alembic upgrade head
      - name: Evaluation (mock provider) with regression gate
        run: python -m evals.run --min-pass 0.90
      - uses: actions/upload-artifact@v4
        with: { name: eval-results, path: "backend/evals/results/latest.json" }

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  docker-smoke:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: docker compose up --build -d --wait --wait-timeout 240
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/health
          KEY=demo-helix-manager-key
          curl -fsS -H "X-API-Key: $KEY" -H 'content-type: application/json' -d '{"message":"Is FS-1003 in stock?"}' localhost:8000/api/chat | grep -q "inventory:FS-1003"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/me)" = 401
          curl -fsS localhost:3000/login >/dev/null
      - if: failure()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
