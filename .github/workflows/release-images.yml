name: Publish images
on:
  push: { tags: ["v*"] }
permissions:
  contents: read
  packages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with: { context: backend, push: true, tags: "ghcr.io/${{ github.repository }}/backend:${{ github.ref_name }}" }
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          build-args: NEXT_PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'http://localhost:8000' }}
          tags: "ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}"
